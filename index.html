<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <h1 class="title">Calculator Pro Pro Max</h1>
    <a href="history.html"><button>History</button></a>
    <label for="number1">Enter number one:</label>
    <input
      class="number1"
      type="number"
      name="number1"
      min="1"
      max="1000"
      required
    />
    <label for="operation">Select the operation:</label>
    <select class="operation" name="operation" id="operation">
      <option value="+">＋</option>
      <option value="-">−</option>
      <option value="*">×</option>
      <option value="/">÷</option>
    </select>

    <label for="number2">Enter number two:</label>
    <input
      class="number2"
      type="number"
      name="number2"
      min="1"
      max="1000"
      required
    />
    <label for="result">Result:</label>
    <output class="output" type="result" name="result"></output>

    <button class="calculate">Calculate</button>
    <button class="clear">Clear</button>

    <p class="aiReference">UI by Gemini</p>
  </body>
</html>
